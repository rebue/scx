server:
  port: 17060

spring:
  config:
    import:
      - optional:consul:consul_svr:8500/${spring.application.name}-${spring.profiles.active}
  cloud:
    consul:
      host: consul_svr

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS